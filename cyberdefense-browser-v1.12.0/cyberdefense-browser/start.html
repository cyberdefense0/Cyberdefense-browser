<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nouvel onglet</title>
    <style>
      :root {
        --cyber: #03e9f4;
        --neon: #8b5cf6;
        --bg: #050816;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 50% -10%, rgba(3,233,244,0.08), transparent 55%), var(--bg);
        background-color: var(--bg);
        color: #e2e8f0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        overflow-y: auto;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 9vh 24px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .clock {
        font-size: 2.6rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: #f8fafc;
        text-shadow: 0 0 24px rgba(3,233,244,0.35);
      }
      .date {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-top: 4px;
        margin-bottom: 34px;
        text-transform: capitalize;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--cyber);
        font-weight: 700;
        letter-spacing: 0.08em;
        margin-bottom: 22px;
        font-size: 0.85rem;
        text-transform: uppercase;
      }
      .brand .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--cyber);
        box-shadow: 0 0 10px var(--cyber);
      }
      form.search {
        width: 100%;
        display: flex;
        gap: 10px;
        margin-bottom: 36px;
      }
      .search input {
        flex: 1;
        background: rgba(15, 23, 42, 0.85);
        border: 1px solid rgba(148, 163, 184, 0.35);
        border-radius: 16px;
        padding: 14px 18px;
        color: #f1f5f9;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .search input:focus {
        border-color: var(--cyber);
        box-shadow: 0 0 0 3px rgba(3,233,244,0.15);
      }
      .search button {
        background: var(--cyber);
        color: #04121a;
        font-weight: 700;
        border: none;
        border-radius: 16px;
        padding: 0 22px;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .search button:hover { opacity: 0.88; }
      .section-title {
        align-self: flex-start;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #64748b;
        margin: 8px 0 12px;
      }
      .tiles {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
        margin-bottom: 30px;
      }
      .tile {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 16px 8px;
        border-radius: 16px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        background: rgba(15, 23, 42, 0.6);
        color: #cbd5e1;
        cursor: pointer;
        text-decoration: none;
        transition: transform 0.15s, border-color 0.15s, background 0.15s;
      }
      .tile:hover {
        transform: translateY(-3px);
        border-color: var(--cyber);
        background: rgba(3,233,244,0.08);
      }
      .tile img {
        width: 26px;
        height: 26px;
        border-radius: 6px;
      }
      .tile span {
        font-size: 0.75rem;
        text-align: center;
        max-width: 100px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .empty {
        color: #64748b;
        font-size: 0.85rem;
        padding: 18px 0;
      }
      .hint {
        color: #475569;
        font-size: 0.72rem;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand"><span class="dot"></span>Cyberdéfense Browser</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="dateLabel"></div>

      <form class="search" id="searchForm">
        <input id="searchInput" type="text" placeholder="Rechercher ou saisir une adresse..." autofocus />
        <button type="submit">Go</button>
      </form>

      <div class="section-title">Favoris</div>
      <div class="tiles" id="favoriteTiles">
        <div class="empty">Aucun favori pour l'instant — ajoutez-en depuis le panneau latéral (⭐).</div>
      </div>

      <div class="hint">Astuce : Ctrl+T nouvel onglet · Ctrl+D favori · Ctrl+L adresse · Ctrl+F recherche dans la page</div>
    </div>

    <script>
      function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('dateLabel').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      }
      updateClock();
      setInterval(updateClock, 15000);

      let searchEngine = 'google';

      function engineUrl(query) {
        const q = encodeURIComponent(query);
        switch (searchEngine) {
          case 'duckduckgo': return `https://duckduckgo.com/?q=${q}`;
          case 'brave': return `https://search.brave.com/search?q=${q}`;
          case 'ecosia': return `https://www.ecosia.org/search?q=${q}`;
          default: return `https://www.google.com/search?q=${q}`;
        }
      }

      function faviconFor(url) {
        try {
          const u = new URL(url);
          return `https://www.google.com/s2/favicons?domain=${u.hostname}&sz=64`;
        } catch (e) {
          return '';
        }
      }

      function renderFavorites(favorites) {
        const container = document.getElementById('favoriteTiles');
        if (!favorites || favorites.length === 0) {
          container.innerHTML = '<div class="empty">Aucun favori pour l\'instant — ajoutez-en depuis le panneau latéral (⭐).</div>';
          return;
        }
        container.innerHTML = '';
        favorites.slice(0, 12).forEach((fav) => {
          const tile = document.createElement('a');
          tile.className = 'tile';
          tile.href = '#';
          tile.onclick = (e) => {
            e.preventDefault();
            window.parent.postMessage({ type: 'cyber-navigate', url: fav.url }, '*');
          };
          const img = document.createElement('img');
          img.src = faviconFor(fav.url);
          img.onerror = () => { img.style.visibility = 'hidden'; };
          const label = document.createElement('span');
          label.textContent = fav.title || fav.url;
          tile.appendChild(img);
          tile.appendChild(label);
          container.appendChild(tile);
        });
      }

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.type !== 'cyber-init') return;
        if (data.searchEngine) searchEngine = data.searchEngine;
        renderFavorites(data.favorites || []);
      });

      document.getElementById('searchForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const value = document.getElementById('searchInput').value.trim();
        if (!value) return;
        const looksLikeUrl = /\.[a-z]{2,}$/i.test(value) || /^https?:\/\//i.test(value);
        const target = looksLikeUrl
          ? (/^https?:\/\//i.test(value) ? value : 'https://' + value)
          : engineUrl(value);
        window.parent.postMessage({ type: 'cyber-navigate', url: target }, '*');
      });

      // Signale au parent que la page est prête à recevoir les favoris.
      window.parent.postMessage({ type: 'cyber-start-ready' }, '*');
    </script>
  </body>
</html>
